<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play | Team Netrunners</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="images/logo.png">
</head>
<body>

    <header>
        <h1>Play</h1>
        <p>Treasure Hunt</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="app.html">Play</a>
        <a href="test.html">Testing</a>
        <a href="notes.html">Notes</a>
    </nav>

    <main>
        <section>
            <h2>Player</h2>
            <p id="welcome"></p>
            <form id="nameForm" onsubmit="saveName(); return false;">
                <input type="text" id="playerName" placeholder="Your name" maxlength="30">
                <button type="submit" class="button">Save</button>
            </form>
            <button type="button" id="changeName" class="button" onclick="changeName()">Change name</button>
        </section>

        <section id="huntsSection">
            <h2>Choose a Treasure Hunt</h2>
            <ul id="challengesList"></ul>
        </section>

        <section id="gameSection" style="display: none;">
            <h2>Treasure Hunt</h2>
            <p id="score"></p>
            <p id="questionText"></p>
            <div id="answerArea"></div>
            <button type="button" id="submitButton" class="button" onclick="submitAnswer(getSessionId())">Submit</button>
            <p id="message"></p>
        </section>

        <section id="leaderboardSection" style="display: none;">
            <h2>Leaderboard</h2>
            <ol id="leaderboardList"></ol>
        </section>
    </main>

    <script src="js/cookies.js"></script>
    <script src="js/player.js"></script>
    <script src="js/api.js"></script>
</body>
</html>
